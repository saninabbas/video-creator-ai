<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Password — AI Video Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0B0C0F; color: #F5F7FA; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .surface { background-color: #121419; }
    .border-custom { border-color: #242832; }
    .text-secondary { color: #9299A6; }
    .text-muted { color: #626977; }
    .brand-gradient { background: linear-gradient(135deg, #8B5CF6 0%, #6366F1 100%); }
    .touch-btn { min-height: 48px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full surface p-8 rounded-2xl border border-custom shadow-2xl space-y-6">
    <!-- Brand Header -->
    <div class="text-center">
      <div class="w-12 h-12 rounded-2xl brand-gradient flex items-center justify-center mx-auto mb-3 shadow-lg shadow-purple-900/30">
        <span class="text-white text-xl">✦</span>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Reset your password</h2>
      <p class="text-xs text-secondary mt-1">Create a strong new password for your account</p>
    </div>

    <div id="reset-alert-error" class="hidden p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-xs"></div>
    <div id="reset-alert-success" class="hidden p-4 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm font-semibold text-center space-y-3">
      <div>✓ Password updated successfully.</div>
      <a href="/" class="block w-full brand-gradient text-white text-xs font-bold py-3 rounded-xl touch-btn">Log In With New Password</a>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" onsubmit="handleResetSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">NEW PASSWORD</label>
        <input id="input-new-pwd" type="password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-[#0B0C0F] border border-custom rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-violet-500 touch-btn" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-muted uppercase tracking-wider mb-1.5">CONFIRM NEW PASSWORD</label>
        <input id="input-confirm-pwd" type="password" required minlength="8" placeholder="Re-enter password" class="w-full bg-[#0B0C0F] border border-custom rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-violet-500 touch-btn" />
      </div>

      <div class="text-[11px] text-muted space-y-1">
        <div>• Minimum 8 characters</div>
        <div>• Case-sensitive</div>
      </div>

      <button type="submit" id="btn-submit-reset" class="w-full brand-gradient text-white font-bold rounded-xl shadow-lg shadow-purple-900/30 hover:opacity-95 transition text-sm touch-btn">
        Reset Password
      </button>
    </form>

    <div class="text-center pt-2">
      <a href="/" class="text-xs text-violet-400 hover:text-violet-300 font-medium">
        ← Return to Log In
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.addEventListener('DOMContentLoaded', () => {
      if (!token) {
        showError('Invalid or missing password reset token. Please request a new link.');
        document.getElementById('btn-submit-reset').disabled = true;
      }
    });

    function showError(msg) {
      const el = document.getElementById('reset-alert-error');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('input-new-pwd').value;
      const confirmPwd = document.getElementById('input-confirm-pwd').value;
      const errBox = document.getElementById('reset-alert-error');
      errBox.classList.add('hidden');

      if (pwd !== confirmPwd) {
        showError('Passwords do not match. Please re-enter.');
        return;
      }

      if (pwd.length < 8) {
        showError('Password must be at least 8 characters long.');
        return;
      }

      const btn = document.getElementById('btn-submit-reset');
      btn.innerText = 'Updating password...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pwd })
        });
        const data = await res.json();

        if (res.ok && data.success) {
          document.getElementById('reset-form').classList.add('hidden');
          document.getElementById('reset-alert-success').classList.remove('hidden');
        } else {
          showError(data.error?.message || 'Could not reset password. The link may be expired.');
          btn.innerText = 'Reset Password';
          btn.disabled = false;
        }
      } catch (err) {
        showError('Network request failed. Please try again.');
        btn.innerText = 'Reset Password';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
