<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reset Password — AI Video Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            bg: '#08090D',
            surface: '#101218',
            'surface-elevated': '#151821',
            border: 'rgba(255, 255, 255, 0.08)',
            primary: '#7C4DFF',
            'primary-hover': '#8B63FF',
            text: '#F5F5F7',
            secondary: '#9A9CA6',
            success: '#4ADE80',
            warning: '#FBBF24',
            error: '#F87171',
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #08090D; color: #F5F5F7; font-family: 'Inter', sans-serif; }
    .custom-border { border-color: rgba(255, 255, 255, 0.08); }
    .transition-base { transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1); }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-[#08090D] text-[#F5F5F7]">

  <div class="max-w-md w-full bg-[#101218] p-8 rounded-2xl border custom-border shadow-2xl space-y-6">
    <!-- Brand Header -->
    <div class="text-center">
      <img src="/assets/logo.png" alt="AI Video Studio" class="h-10 w-auto object-contain mx-auto mb-3" onerror="this.src='/assets/logo.png'" />
      <h2 class="text-xl font-bold text-white tracking-tight">Reset your password</h2>
      <p class="text-xs text-secondary mt-1">Create a strong new password for your account</p>
    </div>

    <div id="reset-alert-error" class="hidden p-3 rounded-xl bg-error/10 border border-error/20 text-error text-xs font-medium"></div>
    <div id="reset-alert-success" class="hidden p-4 rounded-xl bg-success/10 border border-success/20 text-success text-xs font-semibold text-center space-y-3">
      <div>✓ Password updated successfully.</div>
      <a href="/" class="block w-full bg-primary hover:bg-primary-hover text-white text-xs font-bold py-2.5 rounded-xl transition-base">Log In With New Password</a>
    </div>

    <!-- Reset Form -->
    <form id="reset-form" onsubmit="handleResetSubmit(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-secondary mb-1">New Password</label>
        <input id="input-new-pwd" type="password" required minlength="8" placeholder="At least 8 characters" class="w-full bg-[#08090D] border custom-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-primary transition-base" />
      </div>

      <div>
        <label class="block text-xs font-semibold text-secondary mb-1">Confirm New Password</label>
        <input id="input-confirm-pwd" type="password" required minlength="8" placeholder="Re-enter password" class="w-full bg-[#08090D] border custom-border rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-primary transition-base" />
      </div>

      <div class="text-[11px] text-secondary space-y-0.5">
        <div>• Minimum 8 characters</div>
        <div>• Case-sensitive</div>
      </div>

      <button type="submit" id="btn-submit-reset" class="w-full bg-primary hover:bg-primary-hover text-white font-semibold py-2.5 rounded-xl transition-base text-xs shadow-lg shadow-purple-950/40">
        Reset Password
      </button>
    </form>

    <div class="text-center pt-2 border-t custom-border">
      <a href="/" class="text-xs text-secondary hover:text-white transition-base font-medium">
        ← Return to Log In
      </a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    document.addEventListener('DOMContentLoaded', () => {
      if (!token) {
        showError('Invalid or missing password reset token. Please request a new link.');
        document.getElementById('btn-submit-reset').disabled = true;
      }
    });

    function showError(msg) {
      const el = document.getElementById('reset-alert-error');
      el.innerText = msg;
      el.classList.remove('hidden');
    }

    async function handleResetSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('input-new-pwd').value;
      const confirmPwd = document.getElementById('input-confirm-pwd').value;
      const errBox = document.getElementById('reset-alert-error');
      errBox.classList.add('hidden');

      if (pwd !== confirmPwd) {
        showError('Passwords do not match. Please re-enter.');
        return;
      }

      if (pwd.length < 8) {
        showError('Password must be at least 8 characters long.');
        return;
      }

      const btn = document.getElementById('btn-submit-reset');
      btn.innerText = 'Updating Password...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pwd, confirmPassword: confirmPwd }),
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById('reset-form').classList.add('hidden');
          document.getElementById('reset-alert-success').classList.remove('hidden');
        } else {
          showError(data.error?.message || data.message || 'Password reset failed.');
          btn.innerText = 'Reset Password';
          btn.disabled = false;
        }
      } catch (err) {
        showError('Network request failed. Please check connection.');
        btn.innerText = 'Reset Password';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
